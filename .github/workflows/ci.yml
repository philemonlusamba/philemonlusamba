name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Installer ruff
        run: python -m pip install --upgrade pip ruff
      - name: Verifier le style
        run: |
          ruff check .
          ruff format --check .

  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Installer le projet
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Executer les tests
        run: pytest --cov=agents --cov-report=term-missing --cov-fail-under=85
      - name: Verifier la CLI hors ligne
        run: |
          agents tools
          agents run "Combien coutent 12 x 249,99 USD ?" --quiet > /dev/null
          agents council "Index SQL ou recherche plein texte ?" --quiet > /dev/null

  package:
    name: Build du paquet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Construire les artefacts
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
