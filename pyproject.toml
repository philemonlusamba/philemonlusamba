[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multitask-agents"
version = "0.1.0"
description = "Orchestrateur multi-agents parallele : planification, workers concurrents avec outils sandboxes, critique et synthese."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Philemon Lusamba" }]
keywords = ["agents", "llm", "orchestration", "asyncio", "multi-agent"]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
providers = ["httpx>=0.27"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
agents = "agents.cli:main"

[tool.setuptools.packages.find]
include = ["agents*"]

[tool.setuptools.package-data]
agents = ["data/corpus/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "live: appels reseau reels vers un fournisseur LLM (necessite une cle API)",
]

[tool.coverage.run]
source = ["agents"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["agents", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RET", "C4", "PT", "RUF", "ASYNC"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "PT011", "PT018", "E501"]
